<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseAI — Automated Engineering</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#09090b; color:#f8fafc; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
    .wrap { max-width:780px; width:100%; text-align:center; }
    .pill { display:inline-block; padding:6px 14px; border-radius:999px; background:rgba(56,189,248,.15); color:#38bdf8; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    h1 { font-size:44px; margin:16px 0 12px; background:linear-gradient(90deg,#fff,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    p { color:#94a3b8; font-size:17px; line-height:1.6; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:32px; text-align:left; }
    .card { padding:22px; border-radius:18px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); }
    .price { font-size:28px; font-weight:800; color:#38bdf8; margin:8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="pill">Live via VoxAgent Deploy Engine</span>
    <h1>PulseAI Engineering Suite</h1>
    <p>Ship clean commits, open Pull Requests, guard .env secrets, and deploy live in one prompt.</p>
    <div class="cards">
      <div class="card"><h3>Starter</h3><div class="price">zsh/mo</div><p>Local Git safety + instant static previews.</p></div>
      <div class="card"><h3>Pro Team</h3><div class="price">/mo</div><p>Auto PR synthesis, Vercel/Render sync & Slack alerts.</p></div>
    </div>
  </div>
</body>
</html>
